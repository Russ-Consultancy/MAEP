<div class="login-container">
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-header">
        <h1>PingOne Enterprise SSO</h1>
        <p *ngIf="appName; else noApp">Sign in to <strong>{{ appName }}</strong></p>
        <ng-template #noApp><p>Access your enterprise dashboard</p></ng-template>
      </div>

      <div class="login-form">
        <div *ngIf="error" class="error-message">
          {{ errorMessage }}
        </div>

        <div *ngIf="loading" class="error-message">Loading application configuration…</div>

        <div class="sso-login" *ngIf="!loading && !error">
          <p class="form-copy">
            Use your workforce identity managed in PingOne. You will be redirected back to the application.
          </p>
          <button type="button" class="btn-primary" [disabled]="isLoading" (click)="login()">
            {{ isLoading ? 'Redirecting...' : 'Sign In with PingOne' }}
          </button>
        </div>
      </div>
    </div>

    <div class="login-side">
      <div class="side-content">
        <h2>Welcome to the PingOne Enterprise Portal.</h2>
      </div>
    </div>
  </div>
</div>
